<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Image Map</title>
  <style>
    body{font-family:system-ui,-apple-system; margin:20px; line-height:1.4}
    h1{font-size:18px;margin:0 0 12px}
    .hint{color:#666;font-size:12px;margin:0 0 16px}
    .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px}
    .card{border:1px solid #e5e7eb;border-radius:12px; overflow:hidden}
    .img{width:100%; height:140px; object-fit:cover; display:block; background:#f3f4f6}
    .meta{padding:10px}
    .name{font-weight:700;font-size:13px; word-break:break-all}
    .used{font-size:12px;color:#374151;margin-top:6px; white-space:pre-wrap}
    .tag{display:inline-block; font-size:11px; color:#111; background:#f3f4f6; padding:2px 8px; border-radius:999px; margin-top:8px}
    a{color:#0a84ff; text-decoration:none}
  </style>
</head>
<body>
  <h1>assets/img の画像一覧（どのHTMLで使われてるか）</h1>
  <p class="hint">このページはローカル用。画像差し替えの「名前対応」を迷わないための地図です。</p>
  <div id="app" class="grid"></div>

  <script>
    const IMAGES = [
      "assets/img/hero-bg.jpg",
      "assets/img/features-bg-1.jpg",
      "assets/img/features-bg-2.jpg",
      "assets/img/trial-bg.jpg",
      "assets/img/course-1.jpg",
      "assets/img/course-2.jpg",
      "assets/img/course-3.jpg",
      "assets/img/course-4.jpg",
      "assets/img/avatar-1.jpg",
      "assets/img/avatar-2.jpg",
      "assets/img/avatar-3.jpg",
      "assets/img/why-it-sticks.jpg"
    ];

    const PAGES = [
      "index.html",
      "features.html",
      "courses.html",
      "reviews.html",
      "pricing.html",
      "faq.html",
      "diagnosis.html",
      "trial.html",
    ];

    async function fetchText(path){
      try{
        const res = await fetch(path, {cache:"no-store"});
        if(!res.ok) return "";
        return await res.text();
      }catch(e){ return ""; }
    }

    function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

    (async () => {
      const pageTexts = {};
      for(const p of PAGES){
        pageTexts[p] = await fetchText(p);
      }

      const app = document.getElementById("app");

      for(const img of IMAGES){
        const usedIn = [];
        for(const p of PAGES){
          const t = pageTexts[p];
          if(!t) continue;
          const re = new RegExp(escapeRegExp(img), "g");
          if(re.test(t)){
            // 何回出現するか
            const count = (t.match(re) || []).length;
            usedIn.push(`${p}  ×${count}`);
          }
        }

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img class="img" src="${img}" alt="">
          <div class="meta">
            <div class="name">${img}</div>
            <div class="used">${usedIn.length ? usedIn.join("\\n") : "（未使用）"}</div>
            <div class="tag"><a href="${img}" target="_blank">画像を開く</a></div>
          </div>
        `;
        app.appendChild(card);
      }
    })();
  </script>
</body>
</html>
